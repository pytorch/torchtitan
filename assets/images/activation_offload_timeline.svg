: _free_gpu_copies(group i)</text><path d="M677,143 C760,143 820,134 884,108" fill="none" stroke="#E45756" stroke-width="1.6" marker-end="url(#ah-E45756)"/><text x="780" y="118" font-size="11" fill="#E45756" text-anchor="middle" dominant-baseline="middle">compute waits on copy_done_event</text><rect x="372" y="178" width="518" height="20" rx="4" fill="#B279A2" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="631.0" y="188.0" font-size="11" fill="white" text-anchor="middle" dominant-baseline="middle">held on GPU until the free point</text><text x="898" y="188" font-size="11" fill="#B279A2" text-anchor="start" dominant-baseline="middle">dropped</text><rect x="420" y="206" width="750" height="20" rx="4" fill="#D8C3D3" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="795.0" y="216.0" font-size="11" fill="#5A3D55" text-anchor="middle" dominant-baseline="middle">pinned CPU copies (filled as each D2H finishes)</text><text x="10" y="262" font-size="15" fill="#222" text-anchor="start" dominant-baseline="middle" font-weight="bold">Backward: reloading block i's group</text><text x="178" y="328.0" font-size="12" fill="#444" text-anchor="end" dominant-baseline="middle">compute stream</text><text x="178" y="389.0" font-size="12" fill="#444" text-anchor="end" dominant-baseline="middle">_reload_stream</text><text x="178" y="438.0" font-size="12" fill="#444" text-anchor="end" dominant-baseline="middle">GPU copies, group i</text><text x="178" y="466.0" font-size="12" fill="#444" text-anchor="end" dominant-baseline="middle">CPU copies, group i</text><rect x="190" y="308" width="140" height="40" rx="6" fill="#9D9D9D" stroke="none" stroke-width="1.5" fill-opacity="0.55"/><text x="260.0" y="328.0" font-size="13" fill="white" text-anchor="middle" dominant-baseline="middle">block i+2 bwd</text><rect x="330" y="308" width="130" height="40" rx="6" fill="#9DB8DA" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="395.0" y="328.0" font-size="12" fill="#1F3B5C" text-anchor="middle" dominant-baseline="middle">block i+1 replay</text><rect x="460" y="308" width="290" height="40" rx="6" fill="#4C78A8" stroke="none" stroke-width="1.5" fill-opacity="0.75"/><text x="605.0" y="328.0" font-size="13" fill="white" text-anchor="middle" dominant-baseline="middle">block i+1 bwd: grads</text><rect x="750" y="308" width="140" height="40" rx="6" fill="#9DB8DA" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="820.0" y="328.0" font-size="12" fill="#1F3B5C" text-anchor="middle" dominant-baseline="middle">block i replay</text><rect x="890" y="308" width="280" height="40" rx="6" fill="#4C78A8" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="1030.0" y="328.0" font-size="13" fill="white" text-anchor="middle" dominant-baseline="middle">block i bwd: grads</text><path d="M322,296 L338,296 L330,306 Z" fill="#54A24B"/><text x="342" y="286" font-size="12" fill="#2E6B2A" text-anchor="start" dominant-baseline="middle" font-weight="bold">reload trigger: grad hook on block i+1's output (_prefetch_on_grad) -&gt; _reload_group(group i)</text><rect x="342" y="374" width="62" height="30" rx="4" fill="#54A24B" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><path d="M408,383 L414,389 L408,395 L402,389 Z" fill="#222" stroke="#222" stroke-width="2"/><rect x="418" y="374" width="89" height="30" rx="4" fill="#54A24B" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="462.5" y="389.0" font-size="11" fill="white" text-anchor="middle" dominant-baseline="middle">H2D</text><path d="M511,383 L517,389 L511,395 L505,389 Z" fill="#222" stroke="#222" stroke-width="2"/><rect x="521" y="374" width="67" height="30" rx="4" fill="#54A24B" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><path d="M592,383 L598,389 L592,395 L586,389 Z" fill="#222" stroke="#222" stroke-width="2"/><rect x="602" y="374" width="80" height="30" rx="4" fill="#54A24B" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><path d="M686,383 L692,389 L686,395 L680,389 Z" fill="#222" stroke="#222" stroke-width="2"/><text x="700" y="396" font-size="11" fill="#222" text-anchor="start" dominant-baseline="middle">reload_event per storage</text><path d="M408,367 C408,374 762,378 762,351" fill="none" stroke="#333" stroke-width="1.1" marker-end="url(#ah-333)"/><path d="M511,367 C511,374 800,378 800,351" fill="none" stroke="#333" stroke-width="1.1" marker-end="url(#ah-333)"/><path d="M592,367 C592,374 905,378 905,351" fill="none" stroke="#333" stroke-width="1.1" marker-end="url(#ah-333)"/><path d="M686,367 C686,374 975,378 975,351" fill="none" stroke="#333" stroke-width="1.1" marker-end="url(#ah-333)"/><text x="342" y="420" font-size="11" fill="#444" text-anchor="start" dominant-baseline="middle">_unpack: compute waits on the storage's reload_event (the replay reads the block input and SAVE_OUTPUTs first; the grads read the BACKWARD saves)</text><rect x="342" y="428" width="760" height="20" rx="4" fill="#B279A2" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="722.0" y="438.0" font-size="11" fill="white" text-anchor="middle" dominant-baseline="middle">reloaded on GPU; each copy freed with autograd's saved tensor</text><rect x="190" y="456" width="500" height="20" rx="4" fill="#D8C3D3" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="440.0" y="466.0" font-size="11" fill="#5A3D55" text-anchor="middle" dominant-baseline="middle">pinned CPU copies</text><text x="698" y="466" font-size="11" fill="#5A3D55" text-anchor="start" dominant-baseline="middle">buffers return to the pool once their reload_event completes</text><rect x="190" y="505" width="16" height="16" rx="3" fill="#4C78A8" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="212" y="513" font-size="12" fill="#222" text-anchor="start" dominant-baseline="middle">block compute</text><rect x="355" y="505" width="16" height="16" rx="3" fill="#9DB8DA" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="377" y="513" font-size="12" fill="#222" text-anchor="start" dominant-baseline="middle">remat replay</text><rect x="520" y="505" width="16" height="16" rx="3" fill="#F58518" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="542" y="513" font-size="12" fill="#222" text-anchor="start" dominant-baseline="middle">D2H copy</text><rect x="685" y="505" width="16" height="16" rx="3" fill="#54A24B" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="707" y="513" font-size="12" fill="#222" text-anchor="start" dominant-baseline="middle">H2D copy</text><rect x="850" y="505" width="16" height="16" rx="3" fill="#B279A2" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="872" y="513" font-size="12" fill="#222" text-anchor="start" dominant-baseline="middle">GPU memory</text><rect x="1015" y="505" width="16" height="16" rx="3" fill="#D8C3D3" stroke="none" stroke-width="1.5" fill-opacity="1.0"/><text x="1037" y="513" font-size="12" fill="#222" text-anchor="start" dominant-baseline="middle">pinned CPU memory</text><path d="M198,542 L205,549 L198,556 L191,549 Z" fill="#222" stroke="#222" stroke-width="2"/><text x="212" y="549" font-size="12" fill="#222" text-anchor="start" dominant-baseline="middle">CUDA event (copy_done_event, reload_event)</text><line x1="530" y1="541" x2="530" y2="557" stroke="#E45756" stroke-width="2.2" stroke-dasharray="4,3"/><text x="542" y="549" font-size="12" fill="#222" text-anchor="start" dominant-baseline="middle">free point (_free_gpu_copies)</text><path d="M772,545 L788,545 L780,555 Z" fill="#54A24B"/><text x="794" y="549" font-size="12" fill="#222" text-anchor="start" dominant-baseline="middle">reload trigger (_prefetch_on_grad)</text><text x="190" y="583" font-size="11" fill="#666" text-anchor="start" dominant-baseline="middle">All waits are GPU-side event waits between streams; the CPU never blocks. The last group of a model part is freed when the model part's forward returns and is triggered by the model part's output.</text></svg>

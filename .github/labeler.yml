"ciflow/docker":
  globs:
    - .ci/docker/**
    - .github/workflows/docker-builds.yml
  draft: false

"ciflow/fake-pg":
  globs:
    - .ci/docker/**
    - .github/workflows/**
    - scripts/**
    - tests/**
    - torchtitan/**
  draft: false

"ciflow/b200":
  globs:
    - "**/dist_moe/**"
    - "**/*dist_moe*"
    - .github/workflows/*b200*.yaml
    - tests/integration_tests/b200.py
    - torchtitan_recipes/tests/**/b200.py
  draft: false

"ciflow/rl":
  - torchtitan/rl/**
  - tests/rl/**
  - scripts/rl/**
  - torchtitan/trainer.py
  - torchtitan/components/checkpointer/**
  - torchtitan/components/data/**
  - torchtitan/distributed/cuda_graph.py
  - torchtitan/models/common/**
  - torchtitan/models/qwen3_5/**
  - torchtitan/models/qwen3_8/**
  - .github/workflows/integration_test_8gpu_rl.yaml
  - .github/workflows/integration_test_rl_h100.yaml
  - .github/workflows/unit_test_cpu_rl.yaml
  - .github/workflows/unit_test_gpu_rl.yaml

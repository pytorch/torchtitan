name: Trainstation CPU Unit Test

# unit_test_cpu.yaml runs on pytorch/test-infra runners and checks out
# pytorch/torchtitan, so it does not test this repository. This job runs the
# trainstation-only unit tests on GitHub-hosted runners against this checkout.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'torchtitan/experiments/**'
  pull_request:
    paths-ignore:
      - 'torchtitan/experiments/**'
  workflow_dispatch:

concurrency:
  group: unit-test-trainstation-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -l -eo pipefail {0}

jobs:
  megatron-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps

      # The Megatron dataloader JIT-compiles its C++ index helpers with the
      # runner's g++ and ninja (from requirements.txt).
      - name: Run Megatron data unit tests
        run: |
          python -m pytest \
            tests/unit_tests/cpu/components/data/test_megatron_data.py \
            tests/unit_tests/cpu/components/data/test_megatron_scripts.py \
            --durations=20 -vv

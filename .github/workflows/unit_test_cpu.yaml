name: CPU Unit Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'torchtitan/experiments/**'
  pull_request:
    paths-ignore:
      - 'torchtitan/experiments/**'

concurrency:
  group: unit-test${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  set-matrix:
    uses: ./.github/workflows/set-matrix.yaml

  build-test:
    needs: set-matrix
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: 308535385114.dkr.ecr.us-east-1.amazonaws.com/torchtitan/torchtitan-ubuntu-22.04-clang12:${{ needs.set-matrix.outputs.docker-hash }}
      repository: pytorch/torchtitan
      script: |
        set -eux

        # The generic Linux job chooses to use base env, not the one setup by the image
        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"

        pip config --user set global.progress_bar off

        pip install --force-reinstall --pre torch torchvision --index-url https://download.pytorch.org/whl/nightly/cpu

        USE_CPP=0 python -m pip install --pre -r .github/requirements-torchao.txt --index-url https://download.pytorch.org/whl/nightly/cpu
        # TODO: move pytest-xdist into .ci/docker/requirements-dev.txt at the next image change.
        python -m pip install pytest-xdist==3.8.0

        # 8 workers, one per vCPU of mt-l-x86iavx512-8-64, one torch thread each: torch sizes its
        # thread pool from the CPUs it sees, which in a CPU-quota pod can be the host's.
        # loadgroup keeps each xdist_group (tests that bind one fixed port) on one worker.
        # TODO: drop pytest-cov from requirements-dev.txt, or upload coverage if someone needs it.
        OMP_NUM_THREADS=1 pytest tests/unit_tests/cpu -n 8 --dist loadgroup --durations=20 -vv

name: Check Draft

# For a ciflow tag run (tag ciflow/<label>/<PR number>), asks the API whether that PR is a draft.
# A tag push has no PR in its event, so the caller can't read the draft flag itself.
# Any other run skips the job, so a pull_request draft's set-matrix.yaml call stays fully skipped.
on:
  workflow_call:
    outputs:
      is-draft:
        description: "'true' when the tag's PR is a draft, 'false' when it isn't, empty when the job skips (not a ciflow tag run)"
        value: ${{ jobs.check.outputs.is-draft }}

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/ciflow/')
    runs-on: ubuntu-latest
    outputs:
      is-draft: ${{ steps.check.outputs.is-draft }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A hand-pushed tag can end in a commit (ciflow/b200/main-3b1714ab03) instead of a PR number.
          is_draft=false
          if [[ "${GITHUB_REF##*/}" =~ ^[0-9]+$ ]]; then
            # The callers' token has no pull-requests scope; the read works because the repo is public.
            is_draft=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${GITHUB_REF##*/}" --jq .draft)
          fi
          echo "is-draft=$is_draft" >> "$GITHUB_OUTPUT"
          # TODO: a label already on a draft gets no new tag when the PR is marked ready, so this skipped
          # run stays the last one on that commit until a push. pytorch-bot's ciflowPushTrigger.ts could
          # re-push ciflow tags on pull_request.ready_for_review (it handles opened, reopened, synchronize).
          if [[ "$is_draft" == true ]]; then
            echo "::notice::Skipped: the PR is a draft. Once it is ready, push a commit or re-run all jobs of this run."
          fi

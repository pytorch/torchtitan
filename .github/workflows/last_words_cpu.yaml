name: Paired last-words CPU tests
on:
  workflow_dispatch:
    inputs:
      torchft_commit:
        description: Exact paired commit in Skuld7451/torchft_zyf
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TORCHFT_COMMIT: ${{ inputs.torchft_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the exact paired TorchFT revision
        run: |
          set -euo pipefail
          [[ "$TORCHFT_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          git clone --no-checkout https://github.com/Skuld7451/torchft_zyf.git /tmp/paired-torchft
          git -C /tmp/paired-torchft checkout --detach "$TORCHFT_COMMIT"
          test "$(git -C /tmp/paired-torchft rev-parse HEAD)" = "${TORCHFT_COMMIT,,}"
          python -m pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu
          python -m pip install /tmp/paired-torchft
      - name: Install and require both experimental APIs
        run: |
          python -m pip install -e '.[dev]'
          python -c 'from torchft.last_words import LastWordsManager; from torchft_last_words.client import WIRE_VERSION; assert callable(LastWordsManager.quorum_snapshot); assert WIRE_VERSION == 1'
      - name: Run the full added CPU suite
        run: python -m pytest tests/unit_tests/cpu/experiments/torchft -v --junitxml=/tmp/last-words.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-words-cpu-results
          path: /tmp/last-words.xml

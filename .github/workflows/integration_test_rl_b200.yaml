name: RL B200 Integration Tests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: integration-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l -eo pipefail {0}

permissions:
  id-token: write
  contents: read

jobs:
  rl-b200:
    if: github.repository_owner == 'pytorch'
    runs-on: linux.dgx.b200.8
    timeout-minutes: 90
    container:
      image: nvidia/cuda:13.0.3-cudnn-devel-ubuntu22.04
      # TorchStore stages same-host model state dict transfers in /dev/shm; Docker's 64 MiB
      # default cannot hold the Dist-MoE test model's weights (~600 MB in bf16).
      options: --gpus all --shm-size=16g
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Set up environment
        run: |
          set -eux

          bash .ci/docker/common/install_base.sh

          uv venv --python 3.12
          source .venv/bin/activate

          DRIVER_VERSION=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -n 1 || true)
          echo "CUDA driver version: ${DRIVER_VERSION}"

          uv pip install pytest
          bash scripts/install_rl_env.sh --flash-attn 4

          # Dist-MoE is optional; the B200 suite's Dist-MoE test needs it.
          uv pip install \
            "git+https://github.com/meta-pytorch/dist_moe.git@main"

          python - <<'PY'
          import torch

          capability = torch.cuda.get_device_capability()
          if capability not in ((10, 0), (10, 3)):
              raise RuntimeError(
                  f"B200 RL integration requires SM100 or SM103, got SM{capability[0]}{capability[1]}"
              )
          PY

          mkdir -p "$RUNNER_TEMP/artifacts-to-be-uploaded/rl"

      - name: RL integration tests
        run: |
          set -eux
          source .venv/bin/activate
          export PYTHONPATH="$PWD:${PYTHONPATH:-}"

          python -m tests.integration_tests.run_tests \
            "$RUNNER_TEMP/artifacts-to-be-uploaded/rl/integration" --ngpu 8 \
            --test_suite rl_b200

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b200-rl-outputs
          path: ${{ runner.temp }}/artifacts-to-be-uploaded

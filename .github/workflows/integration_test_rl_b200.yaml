name: RL B200 Integration Tests

on:
  push:
    tags:
      - ciflow/b200/*
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: unit-test-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l -eo pipefail {0}

permissions:
  id-token: write
  contents: read

jobs:
  rl-b200:
    if: github.repository_owner == 'pytorch'
    runs-on: linux.dgx.b200.8
    timeout-minutes: 90
    container:
      image: nvidia/cuda:13.0.3-cudnn-devel-ubuntu22.04
      # TorchStore stages same-host weight syncs in /dev/shm; Docker's 64 MiB
      # default cannot hold the Dist-MoE test model's weights (~600 MB in bf16).
      options: --gpus all --shm-size=16g
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Set up environment
        id: setup
        run: |
          set -eux

          bash .ci/docker/common/install_base.sh

          uv venv --python 3.12
          source .venv/bin/activate

          DRIVER_VERSION=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -n 1 || true)
          echo "CUDA driver version: ${DRIVER_VERSION}"

          uv pip install -r requirements.txt
          uv pip install -r torchtitan/rl/requirements.txt pytest
          uv pip install --no-deps "git+https://github.com/meta-pytorch/torchstore.git@main"
          uv pip install --no-deps "git+https://github.com/thinking-machines-lab/batch_invariant_ops.git@main"
          uv pip install torch torchvision vllm xformers --pre \
            --extra-index-url https://download.pytorch.org/whl/nightly/cu132 \
            --index-strategy unsafe-best-match
          uv pip install "flash-attn-4[cu13]>=4.0.0b34"
          uv pip uninstall tilelang

          # Dist-MoE is optional; the B200 suite's Dist-MoE test needs it.
          uv pip install \
            "git+https://github.com/meta-pytorch/dist_moe.git@main"

          python - <<'PY'
          import torch

          capability = torch.cuda.get_device_capability()
          if capability not in ((10, 0), (10, 3)):
              raise RuntimeError(
                  f"B200 RL integration requires SM100 or SM103, got SM{capability[0]}{capability[1]}"
              )
          PY

          mkdir -p "$RUNNER_TEMP/artifacts-to-be-uploaded/rl"

      # The RL Dist-MoE recipe test needs dist_moe, which the CPU unit-test
      # workflows do not install, so it runs here. The Dist-MoE unit tests run in
      # the B200 Integration workflow, which also installs torchao.
      - name: Unit tests
        run: |
          set -eux
          source .venv/bin/activate
          export PYTHONPATH="$PWD:${PYTHONPATH:-}"

          RL_TEST_DUMP_FOLDER="$RUNNER_TEMP/artifacts-to-be-uploaded/rl" \
            torchrun --nproc-per-node=1 -m pytest \
            tests/rl/unit_tests/gpu/test_bitwise_parity.py::TestBitwiseParityKimiK3DebugVarlen \
            tests/unit_tests/cpu/test_rl_dist_moe_recipe.py \
            -v

      # Runs even if the unit tests failed, so one failure does not hide the other.
      - name: RL integration tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -eux
          source .venv/bin/activate
          export PYTHONPATH="$PWD:${PYTHONPATH:-}"

          python -m tests.rl.integration_tests.rl \
            "$RUNNER_TEMP/artifacts-to-be-uploaded/rl" --ngpu 8 \
            --test_suite b200

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b200-rl-outputs
          path: ${{ runner.temp }}/artifacts-to-be-uploaded

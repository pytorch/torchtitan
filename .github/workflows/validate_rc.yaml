name: Validate a TestPyPI Release Candidate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Read RC version
        run: |
          version=$(tr -d '\n' < assets/version.txt)
          case "$version" in
            *rc*) echo "RC_VERSION=$version" >> "$GITHUB_ENV" ;;
            *) echo "Expected an RC version, got: $version"; exit 1 ;;
          esac

      - name: Create clean virtual environment
        run: python -m venv "$RUNNER_TEMP/validate-rc-venv"

      - name: Install release PyTorch packages
        run: |
          "$RUNNER_TEMP/validate-rc-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/validate-rc-venv/bin/python" -m pip install \
            --pre \
            --index-url https://download.pytorch.org/whl/test/cpu \
            "torch==2.15.0" \
            "torchvision==0.29.2" \
            "triton==3.9.0"
          USE_CPP=0 "$RUNNER_TEMP/validate-rc-venv/bin/python" -m pip install \
            --pre \
            --index-url https://download.pytorch.org/whl/nightly/cpu \
            torchao

      - name: Install RC from TestPyPI
        run: |
          for attempt in 1 2 3 4 5; do
            if "$RUNNER_TEMP/validate-rc-venv/bin/python" -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "torchtitan==$RC_VERSION"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Install CPU unit test dependencies
        run: |
          "$RUNNER_TEMP/validate-rc-venv/bin/python" -m pip install \
            -r requirements-dev.txt

      - name: Verify installed package
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/validate-rc-venv/bin/python" - <<'PY'
          import os
          import torchtitan
          import torch
          import torchao
          import torchvision
          import triton

          assert torchtitan.__version__ == os.environ["RC_VERSION"]
          assert "site-packages" in torchtitan.__file__
          print(f"torchtitan={torchtitan.__version__} ({torchtitan.__file__})")
          print(f"torch={torch.__version__}")
          print(f"torchvision={torchvision.__version__}")
          print(f"torchao={torchao.__version__}")
          print(f"triton={triton.__version__}")
          PY

      - name: Run CPU debug-model forward smoke test
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/validate-rc-venv/bin/python" - <<'PY'
          import torch
          import torch.nn.functional as F

          from torchtitan.config.parallelism import ParallelismConfig
          from torchtitan.models.llama3 import build_model_config

          torch.manual_seed(42)
          torch.compiler.set_stance("force_eager")
          model_config = build_model_config(
              "debugmodel",
              parallelism=ParallelismConfig(),
              seq_len=16,
              attn_backend="flex",
          )
          model = model_config.build()
          model.init_states(buffer_device=torch.device("cpu"))
          model.eval()
          tokens_T = torch.randint(0, 2048, (16,))
          positions_T = torch.arange(16)
          attention_metadata = model._get_attention_metadata(positions_T)

          # Torch 2.15 FlexAttention does not support backward on CPU. The GPU
          # release validation runs three full-model training steps instead.
          with torch.no_grad():
              logits_TV = model(tokens_T, positions_T, attention_metadata)
              loss = F.cross_entropy(logits_TV[:-1], tokens_T[1:])

          assert torch.isfinite(loss), loss
          print(f"loss={loss.item()}")
          PY

      - name: Run CPU unit tests against installed RC
        run: |
          test_root="$RUNNER_TEMP/validate-rc-tests"
          mkdir -p "$test_root"
          cp -R tests "$test_root/tests"
          cp -R scripts "$test_root/scripts"
          cp pyproject.toml "$test_root/pyproject.toml"
          mkdir -p "$test_root/torchtitan/models/flux"
          cp torchtitan/models/flux/README.md "$test_root/torchtitan/models/flux/README.md"

          # Installed test recipes resolve repository-local assets relative to
          # site-packages. Link that location to the staged source-test assets.
          site_packages="$("$RUNNER_TEMP/validate-rc-venv/bin/python" -c \
            'import sysconfig; print(sysconfig.get_path("purelib"))')"
          mkdir -p "$site_packages/tests/assets"
          ln -s "$test_root/tests/assets/synthetic_multimodal" \
            "$site_packages/tests/assets/synthetic_multimodal"
          cd "$test_root"
          unset PYTHONPATH
          "$RUNNER_TEMP/validate-rc-venv/bin/python" -m pytest \
            tests/unit_tests/cpu \
            --durations=20 \
            -vv

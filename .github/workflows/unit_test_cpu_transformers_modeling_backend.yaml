name: Transformers Modeling Backend CPU Unit Test

on:
  push:
    branches: [ main ]
    paths:
      - 'torchtitan/experiments/transformers_modeling_backend/**'
      - '.ci/docker/requirements-transformers-modeling-backend.txt'
      - '.github/workflows/unit_test_cpu_transformers_modeling_backend.yaml'
  pull_request:
    paths:
      - 'torchtitan/experiments/transformers_modeling_backend/**'
      - '.ci/docker/requirements-transformers-modeling-backend.txt'
      - '.github/workflows/unit_test_cpu_transformers_modeling_backend.yaml'

concurrency:
  group: unit-test${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    with:
      docker-image: torchtitan-ubuntu-22.04-clang12
      repository: pytorch/torchtitan
      script: |
        set -eux

        # The generic Linux job chooses to use base env, not the one setup by the image
        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"

        pip config --user set global.progress_bar off

        # torchvision must come from the same nightly channel as torch, because
        # transformers depends on it transitively via image_utils.
        pip install --force-reinstall --pre torch torchvision --index-url https://download.pytorch.org/whl/nightly/cpu

        USE_CPP=0 python -m pip install --pre torchao --index-url https://download.pytorch.org/whl/nightly/cpu

        # Install from the pin file rather than a literal version, so that a
        # Transformers bump has to run these tests against the new version.
        python -m pip install -r .ci/docker/requirements-transformers-modeling-backend.txt

        pytest torchtitan/experiments/transformers_modeling_backend/tests/test_rope_init.py -v

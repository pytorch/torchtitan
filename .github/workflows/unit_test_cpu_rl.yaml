name: RL CPU Unit Tests

on:
  push:
    branches: [ main ]
    tags:
      - ciflow/rl/*
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'

concurrency:
  group: unit-test-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  set-matrix:
    # Skip scheduled runs on forks, where they would only fail and email the fork owner
    if: github.repository_owner == 'pytorch' || github.event_name != 'schedule'
    uses: ./.github/workflows/set-matrix.yaml
    with:
      runner-cuda: mt-l-x86aavx2-11-41-a10g
      gpu-arch: cuda

  rl-cpu-unit-tests:
    name: RL CPU Unit Tests
    needs: set-matrix
    if: ${{ needs.set-matrix.outputs.docker-hash != '' }}
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    with:
      runner: mt-l-x86iavx512-8-64
      docker-image: 308535385114.dkr.ecr.us-east-1.amazonaws.com/torchtitan/torchtitan-ubuntu-22.04-clang12:rl-${{ needs.set-matrix.outputs.docker-hash }}
      repository: pytorch/torchtitan
      timeout: 60
      script: |
        set -eux

        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"

        pip config --user set global.progress_bar off

        python -m pip install uv

        # The DAPO math example's rubric needs math-verify.
        uv pip install -r torchtitan/rl/examples/dapo_math/requirements.txt

        # Install matching CUDA nightlies, constrained to keep math-verify's pins.
        bash scripts/install_rl_env.sh --skip-base --flash-attn none \
          --constraint torchtitan/rl/examples/dapo_math/requirements.txt

        # The shared HF cache is read-only and lacks these tokenizers. Fetch only their
        # tokenizer files (no model weights) into a writable cache and export each path.
        TOKENIZER_EXPORTS="$(python -c '
        import os
        from huggingface_hub import snapshot_download

        for env_var, repo in [
            ("MUSE_GLIMMER_TOKENIZER", "meta-models/Muse-Glimmer-30B"),
            ("QWEN3_5_TOKENIZER", "Qwen/Qwen3.5-0.8B"),
        ]:
            path = snapshot_download(
                repo,
                cache_dir=os.path.join(os.environ["RUNNER_TEMP"], "rl-hf-cache"),
                allow_patterns=["config.json", "tokenizer*.json", "chat_template.jinja"],
            )
            print(f"export {env_var}={path}")
        ')"
        eval "${TOKENIZER_EXPORTS}"

        export PYTHONPATH="$PWD:${PYTHONPATH:-}"
        pytest tests/rl/unit_tests/cpu --strict-markers --durations=20 -vv

        # Cover the optional Verifiers examples last, without installing them for all
        # RL jobs. Keep the nightlies installed above and let Verifiers move only its
        # own pinned dependencies (e.g. mcp, openai) for these tests.
        python -c '
        from importlib.metadata import version
        for name in ("torch", "torchvision", "vllm"):
            print(f"{name}=={version(name)}")
        ' > "${RUNNER_TEMP}/nightly-constraints.txt"
        uv pip install -r torchtitan/rl/examples/verifiers/dapo_math/requirements.txt \
          -r torchtitan/rl/examples/verifiers/terminal_bench/requirements.txt \
          --constraint "${RUNNER_TEMP}/nightly-constraints.txt"
        pytest tests/rl/unit_tests/cpu --strict-markers --durations=20 -vv

# The DAPO math example as an installable Verifiers plugin, id "torchtitan-verifiers-dapo-math".
# Install it with its dependencies: pip install -e torchtitan/rl/examples/verifiers/dapo_math
[project]
name = "torchtitan-verifiers-dapo-math"
version = "0.1.0"
description = "TitanRL's DAPO math example as a Verifiers taskset"
requires-python = ">=3.11"
# Verifiers provides the rollout runtime; math-verify scores DAPO responses.
dependencies = ["verifiers==0.4.1", "math-verify==0.9.0"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["torchtitan_verifiers_dapo_math"]
